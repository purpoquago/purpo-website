.templated-scene .depth-slot{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}.templated-scene .depth-slot:empty{display:none}.templated-scene .depth-slot>.layer{position:absolute}.templated-scene .feature-layer{position:fixed!important;z-index:30!important;left:50vw!important;right:auto!important;top:50dvh!important;bottom:auto!important;width:min(70vw,1200px);height:72dvh!important;transform:translate(-50%,-50%);display:grid!important;grid-template-columns:repeat(var(--feature-cols,1),minmax(0,1fr))!important;gap:clamp(28px,4vw,72px);align-items:stretch;pointer-events:none}.feature-column{min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.4vh,18px);pointer-events:auto}.feature-row{width:100%;min-width:0}.feature-row.image{display:flex;justify-content:center}.feature-media{display:block;max-width:100%;max-height:46dvh;width:auto;height:auto;object-fit:contain;margin:0 auto}.feature-text{white-space:pre-wrap;color:#fff;font-family:"EB Garamond",Georgia,serif;font-style:italic}.feature-text.header{font-weight:700;font-size:clamp(32px,3.7vw,64px);line-height:.98}.feature-text.subhead{font-size:clamp(23px,2.4vw,40px);line-height:1.04}.feature-text.body{font-size:clamp(18px,1.45vw,25px);line-height:1.18}.feature-text.caption{font-size:clamp(16px,1.25vw,23px);line-height:1.18}.feature-align-left{text-align:left}.feature-align-center{text-align:center}.feature-align-right{text-align:right}.feature-link-row{display:flex;width:100%}.feature-link-row.feature-align-left{justify-content:flex-start}.feature-link-row.feature-align-center{justify-content:center}.feature-link-row.feature-align-right{justify-content:flex-end}.feature-link1{display:inline-flex;align-items:center;justify-content:center;min-width:150px;padding:10px 22px;border:1px solid currentColor;color:#fff;background:transparent;text-decoration:none;font-family:Arial,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:1}.feature-link1:hover{background:#fff;color:#111}.feature-link2{display:inline-block;color:#9b6cff;text-decoration:none;font-family:Arial,sans-serif;font-size:13px;line-height:1.15}.feature-link2:hover{color:#ffe45c}@media(max-width:800px),(hover:none) and (pointer:coarse){.feature-layer{width:calc(100vw - 40px);height:auto!important;max-height:78dvh;display:flex!important;flex-direction:column;gap:24px;overflow:auto}.feature-column{height:auto;gap:12px}.feature-media{max-height:34dvh}.feature-text.header{font-size:clamp(30px,10vw,50px)}}</style></head><body>

<script id="purpo-home-template-engine-v4">
(()=>{
 const make=(x,k)=>{if(!x||!x.src)return null;const v=x.type==='video',e=document.createElement(v?'video':'img');e.className='layer '+k;e.src=x.src;e.setAttribute('aria-hidden','true');if(v){e.autoplay=true;e.muted=true;e.loop=true;e.playsInline=true;e.preload='auto'}else e.alt='';return e};
 const al=x=>'feature-align-'+(x||'left');
 function renderHome(d){
  const entries=Object.entries(d||{}), template=document.querySelector('[data-template-scene]');
  if(template){
   const parent=template.parentElement, existing=[...parent.querySelectorAll('[data-template-scene]')];
   while(existing.length<entries.length){const clone=template.cloneNode(true);clone.querySelectorAll('[data-depth],.feature-layer').forEach(x=>x.innerHTML='');parent.appendChild(clone);existing.push(clone)}
   existing.forEach((el,i)=>{if(i>=entries.length){el.style.display='none';return}el.style.display='';el.setAttribute('data-template-scene',String(i+1));const id=el.id;if(id&&/^scene\d+$/.test(id))el.id='scene'+(i+1)})
  }
  Object.entries(d||{}).forEach(([key,c])=>{
   const s=document.querySelector('[data-template-scene="'+key.replace('scene','')+'"]');if(!s)return;
   ['back','mid','front'].forEach(k=>{const q=s.querySelector('[data-depth="'+k+'"]');if(!q)return;q.innerHTML='';const e=make(c[k],k);if(e)q.appendChild(e)});
   const host=s.querySelector('.feature-layer');if(!host)return;host.innerHTML='';
   let cols=c.feature&&Array.isArray(c.feature.columns)?c.feature.columns:[];
   if(!cols.length&&c.feature)cols=['left','right'].map(k=>c.feature[k]).filter(Boolean).map(x=>({rows:[x]}));
   cols=cols.slice(0,4);host.style.setProperty('--feature-cols',Math.max(cols.length,1));
   cols.forEach(col=>{const ce=document.createElement('div');ce.className='feature-column';
    (Array.isArray(col.rows)?col.rows:[]).slice(0,5).forEach(x=>{if(!x)return;const row=document.createElement('div');row.className='feature-row '+x.type;
     if(x.type==='image'&&x.src){const im=document.createElement('img');im.className='feature-media';im.src=x.src;im.alt='';if(x.link){const a=document.createElement('a');a.href=x.link;a.appendChild(im);row.appendChild(a)}else row.appendChild(im)}
     else if(x.type==='text'){const t=document.createElement('div');t.className='feature-text '+(x.style||'body')+' '+al(x.align);t.textContent=x.content||'';row.appendChild(t)}
     else if(x.type==='link1'||x.type==='link2'){row.classList.add('feature-link-row',al(x.align));const a=document.createElement('a');a.className=x.type==='link1'?'feature-link1':'feature-link2';a.href=x.url||'#';a.textContent=x.label||'';row.appendChild(a)}
     ce.appendChild(row)});host.appendChild(ce)})
  })
 }
 window.PURPO_RENDER_HOME=renderHome;
 function isolateCMSScene(selected){document.querySelectorAll('[data-template-scene]').forEach(el=>{const match='scene'+el.getAttribute('data-template-scene')===selected;el.style.setProperty('display',match?'block':'none','important');el.style.setProperty('visibility',match?'visible':'hidden','important');el.style.setProperty('opacity',match?'1':'0','important');el.style.setProperty('transform','none','important')});window.scrollTo(0,0)}window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='PURPO_CMS_PREVIEW')return;renderHome(e.data.payload);isolateCMSScene(e.data.selectedScene||'scene1')});
 (async()=>{document.documentElement.classList.add('purpo-loading');try{const r=await fetch('content/home.json',{cache:'no-store'});if(!r.ok)throw Error('home.json '+r.status);let d=await r.json();renderHome(d);window.PURPO_HOME_READY=true;document.dispatchEvent(new Event('purpo-home-ready'))}catch(e){console.error(e)}finally{document.documentElement.classList.remove('purpo-loading')}})();
})();
</script><script>function PURPO_START(){
(()=> {
 const scenes=[...document.querySelectorAll('.scene')],nav=document.getElementById('siteNav'),vig=document.getElementById('uiVignette'),black=document.getElementById('blackout'),motionBtn=document.getElementById('motionEnable');
 let index=0,locked=false,tx=0,ty=0,cx=0,cy=0,raf=0,touching=false,startX=0,startY=0,startPan=0,axis=null,gyroX=0,gyroY=0,lastAuto=performance.now(),autoDir=1,manualUntil=0;
 const pans=[0,0,0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mobile=()=>matchMedia('(max-width:800px),(hover:none) and (pointer:coarse)').matches;  const scenePanLimit=(scene)=>{
    if(!scene)return 0;
    const media=[...scene.querySelectorAll('.depth-slot>.layer')];
    if(!media.length)return 0;
    /* All layers share one master pan. Use the widest rendered layer so the
       composition reaches its true horizontal edges without per-scene tuning. */
    const widest=Math.max(...media.map(el=>el.getBoundingClientRect().width||0));
    return Math.max(0,(widest-innerWidth)/2);
  };
  const limits=()=>scenes.map(scene=>scenePanLimit(scene));
 function req(){if(!raf)raf=requestAnimationFrame(tick)}
 function tick(now){raf=0;
   if(mobile()){const dt=Math.min(40,now-lastAuto);lastAuto=now,lim=limits()[index],speed=(2*lim/28000);pans[index]+=autoDir*speed*dt;if(pans[index]>=lim){pans[index]=lim;autoDir=-1}if(pans[index]<=-lim){pans[index]=-lim;autoDir=1}}else lastAuto=now;
   cx+=(tx+gyroX-cx)*.12;cy+=(ty+gyroY-cy)*.12;
   scenes.forEach((s,i)=>{s.style.setProperty('--mx',cx.toFixed(4));s.style.setProperty('--my',cy.toFixed(4));s.style.setProperty('--pan',(pans[i]||0).toFixed(1)+'px')});
   if(mobile()||Math.abs(tx+gyroX-cx)>.001||Math.abs(ty+gyroY-cy)>.001)req()
 }
 function depth(x,y){tx=clamp((x/innerWidth-.5)*2,-1,1);ty=clamp((y/innerHeight-.5)*2,-1,1);req()}
 function ui(y){const near=y<=innerHeight*.18;nav.classList.toggle('ui-dimmed',!near);vig.style.opacity=near?'1':'0'}
 function paint(){scenes.forEach((s,i)=>{const on=i===index;s.classList.toggle('active',on);s.style.opacity=on?'1':'0';s.style.visibility=on?'visible':'hidden'});black.style.opacity='0';autoDir=1;lastAuto=performance.now()}
 function go(next){next=clamp(next,0,scenes.length-1);if(next===index||locked)return;locked=true;black.style.transition='opacity .2s ease';black.style.opacity='1';setTimeout(()=>{index=next;paint();black.style.opacity='1';scrollTo({top:index*innerHeight,behavior:'auto'});requestAnimationFrame(()=>black.style.opacity='0');setTimeout(()=>locked=false,430)},210)}
 function orient(e){if(!mobile())return;const g=typeof e.gamma==='number'?e.gamma:0,b=typeof e.beta==='number'?e.beta:45;gyroX=clamp(g/20,-.85,.85);gyroY=clamp((b-45)/28,-.65,.65);req()}
 async function enableMotion(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){if(await DeviceOrientationEvent.requestPermission()!=='granted')return}addEventListener('deviceorientation',orient,{passive:true});motionBtn.classList.remove('show');req()}catch(_){}}
 if(mobile()){if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')motionBtn.classList.add('show');else if('DeviceOrientationEvent'in window)addEventListener('deviceorientation',orient,{passive:true});req()}
 motionBtn.addEventListener('click',enableMotion);
 addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<12)return;e.preventDefault();go(index+(e.deltaY>0?1:-1))},{passive:false});
 addEventListener('keydown',e=>{if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(index+1)}else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}});
 addEventListener('touchstart',e=>{if(!mobile())return;const t=e.touches[0];if(!t)return;touching=true;axis=null;startX=t.clientX;startY=t.clientY;startPan=pans[index];ui(t.clientY)},{passive:true});
 addEventListener('touchmove',e=>{if(!mobile()||!touching)return;const t=e.touches[0];if(!t)return;const dy=t.clientY-startY;if(Math.abs(dy)>12){axis='y';e.preventDefault()}},{passive:false});
 addEventListener('touchend',e=>{if(!mobile()||!touching)return;touching=false;const t=e.changedTouches[0];if(!t)return;const dy=t.clientY-startY;if(axis==='y'&&Math.abs(dy)>=55)go(index+(dy<0?1:-1));axis=null;lastAuto=performance.now();req()},{passive:true});
 addEventListener('touchcancel',()=>{touching=false;axis=null;lastAuto=performance.now();req()},{passive:true});
 addEventListener('pointermove',e=>{if(!mobile()&&(e.pointerType==='mouse'||e.pointerType==='pen')){depth(e.clientX,e.clientY);ui(e.clientY)}},{passive:true});
 addEventListener('resize',()=>{const ls=limits();pans.forEach((v,i)=>pans[i]=clamp(v,-ls[i],ls[i]));scrollTo(0,index*innerHeight)},{passive:true});
 paint();scrollTo(0,0);
})();
}
if(window.PURPO_HOME_READY)PURPO_START();else document.addEventListener('purpo-home-ready',PURPO_START,{once:true});</script></body></html>
