<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PURPO Homepage CMS V1.6</title><style>@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@300&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap");*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#111;color:#eee;font:14px Arial}button,input,textarea,select{font:inherit}.top,.foot{height:56px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border:solid #333;border-width:0 0 1px}.foot{border-width:1px 0 0;justify-content:flex-end;gap:8px}.main{display:grid;grid-template-columns:500px 1fr;min-height:calc(100vh - 112px)}.edit{padding:18px;border-right:1px solid #333;overflow-y:auto;overflow-x:hidden;height:calc(100vh - 112px)}.preview{padding:18px;background:#090909;height:calc(100vh - 112px);overflow:hidden}.tabs{display:flex;gap:6px}.btn,.tabs button{background:#181818;color:#eee;border:1px solid #555;padding:8px 11px}.tabs .on,.aligns .on{background:#eee;color:#111}.card,.col{border:1px solid #333;padding:12px;margin:10px 0}h2,h3{font-size:11px;letter-spacing:.12em}h3{color:#aaa}.row{border-top:1px solid #2b2b2b;margin-top:10px;padding-top:10px}.head{display:flex;justify-content:space-between;align-items:center}label{display:block;color:#999;font-size:10px;margin:8px 0 4px}input,textarea,select{width:100%;background:#181818;color:#eee;border:1px solid #444;padding:8px}textarea{min-height:80px}.aligns{display:flex;gap:5px}.aligns button{flex:1}.thumb{height:100px;border:1px solid #333;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{max-width:100%;max-height:100%;object-fit:contain}.wrap{height:calc(100vh - 180px);display:flex;justify-content:center;overflow:hidden;overscroll-behavior:none}.frame{width:100%;height:100%;border:1px solid #333;overflow:hidden;pointer-events:none}.frame.mobile{width:390px;height:844px;max-width:390px;max-height:100%;flex:0 0 auto}.danger{border-color:#744;color:#faa}@media(max-width:900px){.main{grid-template-columns:1fr}.wrap{height:65vh}}.palette{display:flex;flex-wrap:wrap;gap:6px}.swatch{width:27px;height:27px;border:2px solid #444;padding:0}.swatch.on{outline:2px solid #fff;outline-offset:2px}.seg{display:flex;gap:5px}.seg button{flex:1}.seg .on{background:#eee;color:#111}</style></head><body><header class="top"><b>PURPO / HOMEPAGE CMS V2.0</b><span id="status">LOADING</span><span id="backendStatus" style="margin-left:auto;font:11px monospace;color:#999">API: CHECKING…</span></header><main class="main"><section class="edit"><div class="tabs" id="tabs"></div>
<div style="display:flex;gap:6px;margin:10px 0"><button class="btn" id="addScene">+ ADD SCENE</button><button class="btn" id="moveLeft">← MOVE SCENE</button><button class="btn" id="moveRight">MOVE SCENE →</button></div>
<div id="editor"></div></section><section class="preview"><p>PREVIEW <button class="btn" id="desk">DESKTOP</button> <button class="btn" id="mob">MOBILE</button></p><div class="wrap"><iframe class="frame" id="frame" src="../index.html"></iframe></div></section></main><footer class="foot"><button class="btn" id="reset">RESET</button><button class="btn" id="export">EXPORT home.json</button><button class="btn" id="refresh">REFRESH PREVIEW</button></footer><script>
let live={},draft={},key='',pt;function queuePreview(){clearTimeout(pt);pt=setTimeout(preview,120)}const $=s=>document.querySelector(s),cp=x=>JSON.parse(JSON.stringify(x)),st=x=>$('#status').textContent=x;
function norm(s){if(!s.shade)s.shade={enabled:false,opacity:35};if(typeof s.shade.enabled!=='boolean')s.shade.enabled=false;if(!Number.isFinite(Number(s.shade.opacity)))s.shade.opacity=35;if(!s.feature)s.feature={columns:[]};if(!Array.isArray(s.feature.columns)){let o=['left','right'].map(k=>s.feature[k]).filter(Boolean);s.feature={columns:o.map(x=>({rows:[x]}))}}s.feature.columns=s.feature.columns.slice(0,4);s.feature.columns.forEach(c=>{c.rows=(c.rows||[]).slice(0,5);c.rows.forEach(r=>{if((r.type==='text'||r.type==='link1'||r.type==='link2')&&!r.fitTo){r.fitTo=r.alignTo||'100';r.alignTo='100'}})})}
async function boot(){let r=await fetch('../content/home.json',{cache:'no-store'});live=await r.json();let q=localStorage.getItem('purpo-cms-v12');draft=q?JSON.parse(q):cp(live);Object.values(draft).forEach(norm);key=Object.keys(draft)[0];render();st(q?'LOCAL DRAFT':'LIVE JSON')}
function save(){localStorage.setItem('purpo-cms-v12',JSON.stringify(draft));st('DRAFT SAVED')}
function preview(){sessionStorage.setItem('purpo-cms-preview',JSON.stringify(draft));let f=$('#frame');try{f.contentWindow.postMessage({type:'PURPO_CMS_PREVIEW',payload:draft,selectedScene:key},location.origin);st('LIVE DRAFT PREVIEW')}catch(e){console.error(e);st('PREVIEW ERROR')}}
function sceneKeys(){return Object.keys(draft)}
function render(){let keys=sceneKeys();if(!keys.includes(key))key=keys[0]||'';let t=$('#tabs');t.innerHTML='';keys.forEach(k=>{let b=document.createElement('button');b.textContent=k.replace('scene','');b.className=k===key?'on':'';b.onclick=()=>{key=k;render();preview()};t.appendChild(b)});let s=draft[key];if(!s){$('#editor').innerHTML='';return}norm(s);let e=$('#editor');e.innerHTML='<h2>'+key.toUpperCase()+'</h2><h2>BACKGROUND LAYERS</h2>';['back','mid','front'].forEach(d=>e.appendChild(asset(d,s)));e.appendChild(shadeControls(s));let fh=document.createElement('h2');fh.textContent='FEATURE';e.appendChild(fh);s.feature.columns.forEach((c,i)=>e.appendChild(col(c,i,s)));if(s.feature.columns.length<4){let b=document.createElement('button');b.className='btn';b.textContent='+ ADD COLUMN';b.onclick=()=>{s.feature.columns.push({rows:[]});save();render();preview()};e.appendChild(b)}}
function shadeControls(s){let d=document.createElement('div');d.className='card';d.innerHTML='<div class="head"><h3>SHADE</h3><button class="btn shadeToggle">'+(s.shade.enabled?'ON':'OFF')+'</button></div><label>OPACITY <span class="shadeValue">'+Math.round(Number(s.shade.opacity)||0)+'%</span></label><input class="shadeRange" type="range" min="0" max="100" step="1" value="'+(Number(s.shade.opacity)||0)+'">';d.querySelector('.shadeToggle').onclick=()=>{s.shade.enabled=!s.shade.enabled;save();render();preview()};d.querySelector('.shadeRange').oninput=e=>{s.shade.opacity=Number(e.target.value);d.querySelector('.shadeValue').textContent=s.shade.opacity+'%';save();queuePreview()};return d}
function asset(d,s){let box=document.createElement('div');box.className='card';let current=s[d];box.innerHTML='<div class="head"><h3>'+d.toUpperCase()+'</h3><button class="btn danger removeLayer">REMOVE</button></div><div style="font:11px monospace;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px">'+(current?._localName||current?.src||'EMPTY')+'</div><button class="btn chooseLayer">CHOOSE / REPLACE FILE</button><input class="layerPick" type="file" accept="image/*,video/*" hidden>';box.querySelector('.chooseLayer').onclick=()=>box.querySelector('.layerPick').click();box.querySelector('.layerPick').onchange=e=>{let f=e.target.files[0];if(!f)return;s[d]={type:f.type.startsWith('video/')?'video':'image',src:URL.createObjectURL(f),_localName:f.name};save();render();preview()};box.querySelector('.removeLayer').onclick=()=>{s[d]=null;save();render();preview()};return box}
function col(c,i,s){let d=document.createElement('div');d.className='col';d.innerHTML='<div class="head"><h3>COLUMN '+(i+1)+'</h3><span><button class="btn moveColLeft">←</button><button class="btn moveColRight">→</button><button class="btn danger">REMOVE</button></span></div>';d.querySelector('.danger').onclick=()=>{s.feature.columns.splice(i,1);save();render();preview()};d.querySelector('.moveColLeft').onclick=()=>{if(i<=0)return;[s.feature.columns[i-1],s.feature.columns[i]]=[s.feature.columns[i],s.feature.columns[i-1]];save();render();preview()};d.querySelector('.moveColRight').onclick=()=>{if(i>=s.feature.columns.length-1)return;[s.feature.columns[i],s.feature.columns[i+1]]=[s.feature.columns[i+1],s.feature.columns[i]];save();render();preview()};c.rows.forEach((r,j)=>d.appendChild(row(r,j,c)));if(c.rows.length<5){let b=document.createElement('button');b.className='btn';b.textContent='+ ADD ROW';b.onclick=()=>{c.rows.push({type:'text',content:'',style:'body',align:'left'});save();render();preview()};d.appendChild(b)}return d}
function aligns(r){let d=document.createElement('div');d.innerHTML='<label>ALIGN</label><div class="aligns"></div>';['left','center','right'].forEach(v=>{let b=document.createElement('button');b.className='btn '+((r.align||'left')===v?'on':'');b.textContent=v.toUpperCase();b.onclick=()=>{r.align=v;save();render();preview()};d.querySelector('div').appendChild(b)});return d}
const PURPO_COLORS=['#ff3eb4','#ff3452','#ffdb70','#ff8812','#005859','#57b9a0','#7f2a47','#120940','#ffffff'];function segmented(label,vals,current,onpick){let d=document.createElement('div');d.innerHTML='<label>'+label+'</label><div class="seg"></div>';vals.forEach(v=>{let b=document.createElement('button');b.className='btn '+(String(current)===String(v)?'on':'');b.textContent=v+'%';b.onclick=()=>onpick(v);d.querySelector('.seg').appendChild(b)});return d}function palette(r){let d=document.createElement('div');d.innerHTML='<label>COLOR</label><div class="palette"></div>';PURPO_COLORS.forEach(v=>{let b=document.createElement('button');b.className='swatch '+((r.color||'#ffffff').toLowerCase()===v?'on':'');b.style.background=v;b.title=v;b.onclick=()=>{r.color=v;save();render();preview()};d.querySelector('.palette').appendChild(b)});return d}function row(r,j,c){let d=document.createElement('div');d.className='row';d.innerHTML='<div class="head"><h3>ROW '+(j+1)+'</h3><span><button class="btn moveRowUp">↑</button><button class="btn moveRowDown">↓</button><button class="btn danger">REMOVE</button></span></div><label>TYPE</label><select><option value="image">Image</option><option value="text">Text</option><option value="link1">Link Style 1</option><option value="link2">Link Style 2</option></select><div class="fields"></div>';d.querySelector('.danger').onclick=()=>{c.rows.splice(j,1);save();render();preview()};d.querySelector('.moveRowUp').onclick=()=>{if(j<=0)return;[c.rows[j-1],c.rows[j]]=[c.rows[j],c.rows[j-1]];save();render();preview()};d.querySelector('.moveRowDown').onclick=()=>{if(j>=c.rows.length-1)return;[c.rows[j],c.rows[j+1]]=[c.rows[j+1],c.rows[j]];save();render();preview()};let sel=d.querySelector('select');sel.value=r.type;sel.onchange=()=>{let x=sel.value;Object.keys(r).forEach(k=>delete r[k]);r.type=x;if(x==='image')r.size='100';if(x!=='image'){r.align='left';r.fitTo='100';r.alignTo='100';r.color='#ffffff'}if(x==='text')r.style='body';save();render();preview()};let f=d.querySelector('.fields');
if(r.type==='image'){f.innerHTML='<label>IMAGE</label><div class="thumb">'+(r.src?'<img src="'+r.src+'">':'NO IMAGE')+'</div><button class="btn choose">CHOOSE IMAGE</button><input class="pick" type="file" accept="image/*" hidden><label>LINK OPTIONAL</label><input class="url">';f.querySelector('.url').value=r.link||'';f.querySelector('.url').oninput=e=>{r.link=e.target.value;save();queuePreview()};f.querySelector('.choose').onclick=()=>f.querySelector('.pick').click();f.querySelector('.pick').onchange=e=>{let x=e.target.files[0];if(!x)return;r.src=URL.createObjectURL(x);r._localName=x.name;save();render();preview()};f.appendChild(segmented('IMAGE SIZE',['100','50','25'],r.size||'100',v=>{r.size=v;save();render();preview()}))}
if(r.type==='text'){f.innerHTML='<label>TEXT</label><textarea></textarea><label>STYLE</label><select><option value="header">Header</option><option value="subhead">Subhead</option><option value="body">Body</option><option value="caption">Caption</option></select>';f.querySelector('textarea').value=r.content||'';f.querySelector('textarea').oninput=e=>{r.content=e.target.value;save();queuePreview()};f.querySelector('select').value=r.style||'body';f.querySelector('select').onchange=e=>{r.style=e.target.value;save();preview()};f.appendChild(aligns(r));f.appendChild(segmented('FIT TO',['100','50','25'],r.fitTo||'100',v=>{r.fitTo=v;save();render();preview()}));f.appendChild(segmented('ALIGN TO',['100','50','25'],r.alignTo||'100',v=>{r.alignTo=v;save();render();preview()}));f.appendChild(palette(r))}
if(r.type==='link1'||r.type==='link2'){f.innerHTML='<label>LABEL</label><input class="lab"><label>URL</label><input class="url">';f.querySelector('.lab').value=r.label||'';f.querySelector('.url').value=r.url||'';f.querySelector('.lab').oninput=e=>{r.label=e.target.value;save();queuePreview()};f.querySelector('.url').oninput=e=>{r.url=e.target.value;save();queuePreview()};f.appendChild(aligns(r));f.appendChild(segmented('FIT TO',['100','50','25'],r.fitTo||'100',v=>{r.fitTo=v;save();render();preview()}));f.appendChild(segmented('ALIGN TO',['100','50','25'],r.alignTo||'100',v=>{r.alignTo=v;save();render();preview()}));f.appendChild(palette(r))}return d}

function renumberScenes(items){let n={};items.forEach((v,i)=>n['scene'+(i+1)]=v);draft=n;key='scene'+Math.min(items.length,Math.max(1,items.indexOf(items._selected)+1))}
function orderedValues(){return sceneKeys().map(k=>draft[k])}
$('#addScene').onclick=()=>{let vals=orderedValues();let fresh={back:null,mid:null,front:null,shade:{enabled:false,opacity:35},feature:{columns:[]}};vals.push(fresh);let n={};vals.forEach((v,i)=>n['scene'+(i+1)]=v);draft=n;key='scene'+vals.length;save();render();preview()};
$('#moveLeft').onclick=()=>{let keys=sceneKeys(),i=keys.indexOf(key);if(i<=0)return;let vals=keys.map(k=>draft[k]);[vals[i-1],vals[i]]=[vals[i],vals[i-1]];let n={};vals.forEach((v,j)=>n['scene'+(j+1)]=v);draft=n;key='scene'+i;save();render();preview()};
$('#moveRight').onclick=()=>{let keys=sceneKeys(),i=keys.indexOf(key);if(i<0||i>=keys.length-1)return;let vals=keys.map(k=>draft[k]);[vals[i],vals[i+1]]=[vals[i+1],vals[i]];let n={};vals.forEach((v,j)=>n['scene'+(j+1)]=v);draft=n;key='scene'+(i+2);save();render();preview()};
$('#frame').addEventListener('load',()=>setTimeout(preview,60));$('#desk').onclick=()=>$('#frame').classList.remove('mobile');$('#mob').onclick=()=>$('#frame').classList.add('mobile');$('#refresh').onclick=preview;$('#reset').onclick=()=>{draft=cp(live);Object.values(draft).forEach(norm);localStorage.removeItem('purpo-cms-v12');render();preview()};$('#export').onclick=()=>{let b=new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='home.json';a.click()};boot();

async function checkBackend(){
  const el=document.getElementById('backendStatus'); if(!el)return;
  try{
    const r=await fetch('/api/health',{cache:'no-store'});
    const j=await r.json();
    el.textContent='API: '+(j.ok?'READY':'ERROR');
    el.style.color=j.ok?'#57b9a0':'#ff3452';
  }catch(e){el.textContent='API: OFFLINE';el.style.color='#ff3452'}
}
checkBackend();
</script></body></html>
