<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PURPO Homepage CMS V1</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px Arial,sans-serif}button,input,textarea,select{font:inherit}.top,.foot{height:56px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-color:#333;border-style:solid}.top{border-width:0 0 1px}.foot{border-width:1px 0 0;justify-content:flex-end;gap:8px}.brand{font-size:12px;font-weight:bold;letter-spacing:.1em}.status{font-size:10px;color:#999}.main{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 112px)}.edit{padding:18px;border-right:1px solid #333;overflow:auto}.preview{padding:18px;background:#090909}.tabs{display:flex;gap:6px;margin-bottom:18px}.tabs button,.btn{background:#181818;color:#eee;border:1px solid #555;padding:8px 11px}.tabs .on{background:#eee;color:#111}.card{border:1px solid #333;padding:12px;margin:9px 0}h2,h3{font-size:11px;letter-spacing:.12em}h2{margin-top:22px}h3{color:#aaa}.row{display:flex;gap:8px;align-items:center}.path{flex:1;font:11px monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}label{display:block;color:#999;font-size:10px;margin:9px 0 4px}input,textarea,select{width:100%;background:#181818;color:#eee;border:1px solid #444;padding:8px}textarea{min-height:90px}.features{display:grid;grid-template-columns:1fr 1fr;gap:8px}.feature{border:1px solid #333;padding:10px}.pbar{display:flex;justify-content:space-between;margin-bottom:10px;font-size:11px}.wrap{height:calc(100vh - 170px);display:flex;justify-content:center}.frame{width:100%;height:100%;border:1px solid #333;background:#000}.frame.mobile{max-width:390px}.primary{background:#eee;color:#111}.note{font-size:11px;color:#888;line-height:1.45}@media(max-width:850px){.main{grid-template-columns:1fr}.edit{border-right:0}.wrap{height:65vh}.features{grid-template-columns:1fr}}</style></head>
<body><header class="top"><div class="brand">PURPO / HOMEPAGE CMS V1</div><div class="status" id="status">LOADING</div></header>
<main class="main"><section class="edit"><div class="tabs" id="tabs"></div><div id="editor"></div><p class="note">Motion, parallax, gimbal and pan remain controlled by the homepage template. This editor changes content only.</p></section>
<section class="preview"><div class="pbar"><span>PREVIEW</span><span><button class="btn" id="desk">DESKTOP</button> <button class="btn" id="mob">MOBILE</button></span></div><div class="wrap"><iframe class="frame" id="frame" src="../index.html"></iframe></div></section></main>
<footer class="foot"><button class="btn" id="reset">RESET DRAFT</button><button class="btn" id="export">EXPORT home.json</button><button class="btn primary" id="refresh">REFRESH PREVIEW</button></footer>
<script>
let live={},draft={},key='';const $=s=>document.querySelector(s),copy=x=>JSON.parse(JSON.stringify(x)),stat=x=>$('#status').textContent=x;
async function boot(){let r=await fetch('../content/home.json',{cache:'no-store'});live=await r.json();let s=localStorage.getItem('purpo-cms-v1');draft=s?JSON.parse(s):copy(live);key=Object.keys(draft)[0];render();stat(s?'LOCAL DRAFT':'LIVE JSON')}
function save(){localStorage.setItem('purpo-cms-v1',JSON.stringify(draft));stat('DRAFT SAVED LOCALLY')}
function render(){let t=$('#tabs');t.innerHTML='';Object.keys(draft).forEach(k=>{let b=document.createElement('button');b.textContent=k.replace('scene','');b.className=k===key?'on':'';b.onclick=()=>{key=k;render()};t.appendChild(b)});let s=draft[key],e=$('#editor');e.innerHTML='<h2>'+key.toUpperCase()+'</h2>';['back','mid','front'].forEach(d=>e.appendChild(asset(d,s)));let h=document.createElement('h2');h.textContent='FEATURE';e.appendChild(h);let g=document.createElement('div');g.className='features';['left','right'].forEach(x=>g.appendChild(feature(x,s)));e.appendChild(g)}
function asset(d,s){let c=document.createElement('div');c.className='card';c.innerHTML='<h3>'+d.toUpperCase()+'</h3><div class="row"><span class="path">'+(s[d]?.src||'EMPTY')+'</span><button class="btn">EDIT</button></div>';c.querySelector('button').onclick=()=>{let p=prompt(d.toUpperCase()+' asset path',s[d]?.src||'');if(p===null)return;s[d]=p.trim()?{type:/\\.(webm|mp4)$/i.test(p)?'video':'image',src:p.trim()}:null;save();render()};return c}
function feature(side,s){s.feature=s.feature||{left:null,right:null};let c=document.createElement('div');c.className='feature';c.innerHTML='<h3>'+side.toUpperCase()+'</h3><label>TYPE</label><select><option value="empty">Empty</option><option value="image">Image</option><option value="text">Text</option></select><div class="fields"></div>';let sel=c.querySelector('select'),f=c.querySelector('.fields'),v=s.feature[side];sel.value=v?.type||'empty';
function draw(){f.innerHTML='';let type=sel.value;if(type==='empty'){s.feature[side]=null;save();return}let x=s.feature[side];if(!x||x.type!==type)x=s.feature[side]={type};if(type==='image')f.innerHTML='<label>IMAGE PATH</label><input data-k="src"><label>LINK</label><input data-k="link">';else f.innerHTML='<label>TEXT</label><textarea data-k="content"></textarea><label>STYLE</label><select data-k="style"><option>heading</option><option>subheading</option><option>body</option><option>caption</option></select><label>ALIGN</label><select data-k="align"><option>left</option><option>center</option><option>right</option></select><label>BUTTON LABEL</label><input data-k="buttonLabel"><label>BUTTON LINK</label><input data-k="buttonUrl">';f.querySelectorAll('[data-k]').forEach(el=>{el.value=x[el.dataset.k]||'';el.oninput=()=>{x[el.dataset.k]=el.value;save()}})}
sel.onchange=()=>{s.feature[side]=sel.value==='empty'?null:{type:sel.value};draw()};draw();return c}
$('#desk').onclick=()=>$('#frame').classList.remove('mobile');$('#mob').onclick=()=>$('#frame').classList.add('mobile');$('#refresh').onclick=()=>{$('#frame').src='../index.html?t='+Date.now();stat('PREVIEW REFRESHED')};$('#reset').onclick=()=>{if(confirm('Reset draft?')){draft=copy(live);localStorage.removeItem('purpo-cms-v1');render();stat('DRAFT RESET')}};$('#export').onclick=()=>{let b=new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='home.json';a.click();URL.revokeObjectURL(a.href);stat('EXPORTED')};boot().catch(e=>{console.error(e);stat('LOAD ERROR')});
</script></body></html>
