<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PURPO CMS V1.2</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px Arial}button,input,textarea,select{font:inherit}.top,.foot{height:56px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border:solid #333;border-width:0 0 1px}.foot{border-width:1px 0 0;justify-content:flex-end;gap:8px}.main{display:grid;grid-template-columns:500px 1fr;min-height:calc(100vh - 112px)}.edit{padding:18px;border-right:1px solid #333}.preview{padding:18px;background:#090909}.tabs{display:flex;gap:6px}.btn,.tabs button{background:#181818;color:#eee;border:1px solid #555;padding:8px 11px}.tabs .on,.aligns .on{background:#eee;color:#111}.card,.col{border:1px solid #333;padding:12px;margin:10px 0}h2,h3{font-size:11px;letter-spacing:.12em}h3{color:#aaa}.row{border-top:1px solid #2b2b2b;margin-top:10px;padding-top:10px}.head{display:flex;justify-content:space-between;align-items:center}label{display:block;color:#999;font-size:10px;margin:8px 0 4px}input,textarea,select{width:100%;background:#181818;color:#eee;border:1px solid #444;padding:8px}textarea{min-height:80px}.aligns{display:flex;gap:5px}.aligns button{flex:1}.thumb{height:100px;border:1px solid #333;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{max-width:100%;max-height:100%;object-fit:contain}.wrap{height:calc(100vh - 180px);display:flex;justify-content:center}.frame{width:100%;height:100%;border:1px solid #333}.frame.mobile{max-width:390px}.danger{border-color:#744;color:#faa}@media(max-width:900px){.main{grid-template-columns:1fr}.wrap{height:65vh}}</style></head><body><header class="top"><b>PURPO / HOMEPAGE CMS V1.2</b><span id="status">LOADING</span></header><main class="main"><section class="edit"><div class="tabs" id="tabs"></div><div id="editor"></div></section><section class="preview"><p>PREVIEW <button class="btn" id="desk">DESKTOP</button> <button class="btn" id="mob">MOBILE</button></p><div class="wrap"><iframe class="frame" id="frame" src="../index.html"></iframe></div></section></main><footer class="foot"><button class="btn" id="reset">RESET</button><button class="btn" id="export">EXPORT home.json</button><button class="btn" id="refresh">REFRESH PREVIEW</button></footer><script>
let live={},draft={},key='';const $=s=>document.querySelector(s),cp=x=>JSON.parse(JSON.stringify(x)),st=x=>$('#status').textContent=x;
function norm(s){if(!s.feature)s.feature={columns:[]};if(!Array.isArray(s.feature.columns)){let o=['left','right'].map(k=>s.feature[k]).filter(Boolean);s.feature={columns:o.map(x=>({rows:[x]}))}}s.feature.columns=s.feature.columns.slice(0,4);s.feature.columns.forEach(c=>c.rows=(c.rows||[]).slice(0,5))}
async function boot(){let r=await fetch('../content/home.json',{cache:'no-store'});live=await r.json();let q=localStorage.getItem('purpo-cms-v12');draft=q?JSON.parse(q):cp(live);Object.values(draft).forEach(norm);key=Object.keys(draft)[0];render();st(q?'LOCAL DRAFT':'LIVE JSON')}
function save(){localStorage.setItem('purpo-cms-v12',JSON.stringify(draft));st('DRAFT SAVED')}
function preview(){sessionStorage.setItem('purpo-cms-preview',JSON.stringify(draft));$('#frame').src='../index.html?p='+Date.now();st('DRAFT PREVIEW')}
function render(){let t=$('#tabs');t.innerHTML='';Object.keys(draft).forEach(k=>{let b=document.createElement('button');b.textContent=k.replace('scene','');b.className=k===key?'on':'';b.onclick=()=>{key=k;render()};t.appendChild(b)});let s=draft[key];norm(s);let e=$('#editor');e.innerHTML='<h2>'+key.toUpperCase()+'</h2><h2>FEATURE</h2>';s.feature.columns.forEach((c,i)=>e.appendChild(col(c,i,s)));if(s.feature.columns.length<4){let b=document.createElement('button');b.className='btn';b.textContent='+ ADD COLUMN';b.onclick=()=>{s.feature.columns.push({rows:[]});save();render();preview()};e.appendChild(b)}}
function col(c,i,s){let d=document.createElement('div');d.className='col';d.innerHTML='<div class="head"><h3>COLUMN '+(i+1)+'</h3><button class="btn danger">REMOVE</button></div>';d.querySelector('button').onclick=()=>{s.feature.columns.splice(i,1);save();render();preview()};c.rows.forEach((r,j)=>d.appendChild(row(r,j,c)));if(c.rows.length<5){let b=document.createElement('button');b.className='btn';b.textContent='+ ADD ROW';b.onclick=()=>{c.rows.push({type:'text',content:'',style:'body',align:'left'});save();render();preview()};d.appendChild(b)}return d}
function aligns(r){let d=document.createElement('div');d.innerHTML='<label>ALIGN</label><div class="aligns"></div>';['left','center','right'].forEach(v=>{let b=document.createElement('button');b.className='btn '+((r.align||'left')===v?'on':'');b.textContent=v.toUpperCase();b.onclick=()=>{r.align=v;save();render();preview()};d.querySelector('div').appendChild(b)});return d}
function row(r,j,c){let d=document.createElement('div');d.className='row';d.innerHTML='<div class="head"><h3>ROW '+(j+1)+'</h3><button class="btn danger">REMOVE</button></div><label>TYPE</label><select><option value="image">Image</option><option value="text">Text</option><option value="link1">Link Style 1</option><option value="link2">Link Style 2</option></select><div class="fields"></div>';d.querySelector('.danger').onclick=()=>{c.rows.splice(j,1);save();render();preview()};let sel=d.querySelector('select');sel.value=r.type;sel.onchange=()=>{let x=sel.value;Object.keys(r).forEach(k=>delete r[k]);r.type=x;if(x!=='image')r.align='left';if(x==='text')r.style='body';save();render();preview()};let f=d.querySelector('.fields');
if(r.type==='image'){f.innerHTML='<label>IMAGE</label><div class="thumb">'+(r.src?'<img src="'+r.src+'">':'NO IMAGE')+'</div><button class="btn choose">CHOOSE IMAGE</button><input class="pick" type="file" accept="image/*" hidden><label>LINK OPTIONAL</label><input class="url">';f.querySelector('.url').value=r.link||'';f.querySelector('.url').oninput=e=>{r.link=e.target.value;save()};f.querySelector('.choose').onclick=()=>f.querySelector('.pick').click();f.querySelector('.pick').onchange=e=>{let x=e.target.files[0];if(!x)return;r.src=URL.createObjectURL(x);r._localName=x.name;save();render();preview()}}
if(r.type==='text'){f.innerHTML='<label>TEXT</label><textarea></textarea><label>STYLE</label><select><option value="header">Header</option><option value="subhead">Subhead</option><option value="body">Body</option><option value="caption">Caption</option></select>';f.querySelector('textarea').value=r.content||'';f.querySelector('textarea').oninput=e=>{r.content=e.target.value;save()};f.querySelector('select').value=r.style||'body';f.querySelector('select').onchange=e=>{r.style=e.target.value;save();preview()};f.appendChild(aligns(r))}
if(r.type==='link1'||r.type==='link2'){f.innerHTML='<label>LABEL</label><input class="lab"><label>URL</label><input class="url">';f.querySelector('.lab').value=r.label||'';f.querySelector('.url').value=r.url||'';f.querySelector('.lab').oninput=e=>{r.label=e.target.value;save()};f.querySelector('.url').oninput=e=>{r.url=e.target.value;save()};f.appendChild(aligns(r))}return d}
$('#desk').onclick=()=>$('#frame').classList.remove('mobile');$('#mob').onclick=()=>$('#frame').classList.add('mobile');$('#refresh').onclick=preview;$('#reset').onclick=()=>{draft=cp(live);Object.values(draft).forEach(norm);localStorage.removeItem('purpo-cms-v12');render();preview()};$('#export').onclick=()=>{let b=new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='home.json';a.click()};boot();
</script></body></html>
