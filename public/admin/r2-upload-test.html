<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PURPO R2 Upload Test</title>
<style>
body{margin:0;background:#120940;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
main{width:min(560px,calc(100% - 40px));border:1px solid #fff;padding:28px}
h1{font-size:18px;font-weight:400;letter-spacing:.08em}button,input{margin-top:16px}
button{background:transparent;color:#fff;border:1px solid #fff;padding:10px 16px;cursor:pointer}
#state,#result{margin-top:16px;font:12px monospace;word-break:break-all}a{color:#ffdb70}
</style></head><body><main>
<h1>PURPO CMS V2.0B — R2 UPLOAD TEST</h1>
<input id="file" type="file" accept="image/*,video/*"><br>
<button id="upload">UPLOAD TEST FILE</button>
<div id="state">READY</div><div id="result"></div>
<script>
document.getElementById('upload').onclick=async()=>{
 const f=document.getElementById('file').files[0],s=document.getElementById('state'),o=document.getElementById('result');
 if(!f){s.textContent='CHOOSE A FILE';return}
 s.textContent='UPLOADING…';o.textContent='';
 try{
  const fd=new FormData();fd.append('file',f);
  const r=await fetch('/api/upload-test',{method:'POST',body:fd});
  const j=await r.json();
  if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
  s.textContent='UPLOAD OK';
  o.innerHTML='R2 KEY: '+j.key+'<br><a target="_blank" rel="noopener" href="'+j.url+'">'+j.url+'</a>';
 }catch(e){s.textContent='UPLOAD FAILED';o.textContent=e.message||String(e)}
};
</script></main></body></html>
